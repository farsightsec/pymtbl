[build-system]
requires = ["setuptools>=42", "Cython>=0.27"]
build-backend = "setuptools.build_meta"

[project]
name = "pymtbl"
version = "0.6.1"
description = "Python extension module for the mtbl C library"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.5"
authors = [
    {name = "Farsight Security, Inc.", email = "software@farsightsecurity.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/farsightsec/pymtbl"

[tool.setuptools]
py-modules = []
